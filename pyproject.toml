[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-tag"
version = "1.9.0"
description = "A desktop tool for identifying, annotating and cataloguing marine species in underwater imagery."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "PySide6>=6.10,<7",
  "yoyo-migrations>=9,<10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.scripts]
reef-tag = "reef_tag.__main__:main"
reef-tag-transfer = "reef_tag.nature_recorder:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reef_tag*"]

[tool.setuptools.package-data]
reef_tag = ["resources/*", "resources/reeftag.iconset/*", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
